<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Rentya</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rentya">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F7FB">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;background:#F6F7FB;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1F2A44;overscroll-behavior:none;overflow:hidden}
  /* zone de la barre d'accueil iPhone, de la couleur de la barre de navigation */
  .bot{position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom);background:#fff}
  iframe{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);width:100%;height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));border:0;opacity:0;transition:opacity .25s}
  iframe.on{opacity:1}
  .splash,.setup{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  .splash img,.setup img{width:84px;height:84px;border-radius:22px;box-shadow:0 10px 30px rgba(31,42,68,.15)}
  .splash span{font-size:13px;color:#94A3B8}
  .dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:#3B5BDB;animation:b 1s infinite ease-in-out}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:none}}
  .setup h1{font-size:24px;margin:6px 0 0}
  .setup p{margin:0;font-size:14px;color:#6B7280;max-width:300px;line-height:1.45}
  .setup input{width:220px;text-align:center;font-size:22px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid #DCE3FB;border-radius:14px;padding:12px;outline:none;color:#1F2A44;background:#fff;font-family:inherit}
  .setup input:focus{border-color:#3B5BDB}
  .setup button{width:246px;border:0;border-radius:14px;padding:15px;background:#3B5BDB;color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
  .setup button:disabled{background:#CBD5E1}
  .setup small{font-size:12px;color:#94A3B8}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="bot"></div>
<div class="splash" id="splash"><img src="icon-180.png" alt=""><div class="dots"><i></i><i></i><i></i></div><span>Chargement…</span></div>
<form class="setup" id="setup" hidden>
  <img src="icon-180.png" alt="">
  <h1>Rentya</h1>
  <p>Entrez votre code d'accès. Il ne vous sera demandé qu'une seule fois sur cet appareil.</p>
  <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" maxlength="20">
  <button id="go" type="submit" disabled>Ouvrir l'application</button>
  <small>Code fourni lors de l'installation</small>
</form>
<script>
  // Adresse de l'application Google Apps Script (celle qui se termine par /exec)
  const APP_URL = 'https://script.google.com/macros/s/AKfycbybRtczq8WfmRqgKsRmTucivyYceAkXT0jctbFzizssqLGV1gMuEKNTEvsreapdO5k/exec';
  const KEY = 'rentya_code';
  const get = () => { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } };
  const set = v => { try { localStorage.setItem(KEY, v); } catch (e) {} };
  if (location.hash === '#reset') { try { localStorage.removeItem(KEY); } catch (e) {} history.replaceState(null, '', location.pathname); }

  function open(code) {
    document.getElementById('setup').hidden = true;
    document.getElementById('splash').hidden = false;
    const f = document.createElement('iframe');
    f.title = 'Rentya';
    f.allow = 'clipboard-write';
    f.src = APP_URL + (APP_URL.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(code);
    f.onload = () => { f.classList.add('on'); setTimeout(() => document.getElementById('splash').hidden = true, 250); };
    document.body.appendChild(f);
  }

  const code = get();
  if (code) open(code);
  else {
    document.getElementById('splash').hidden = true;
    const form = document.getElementById('setup'), inp = document.getElementById('code'), btn = document.getElementById('go');
    form.hidden = false;
    inp.addEventListener('input', () => { btn.disabled = inp.value.trim().length < 4; });
    form.addEventListener('submit', e => { e.preventDefault(); const v = inp.value.trim().toUpperCase(); set(v); open(v); });
  }
</script>
</body>
</html>
