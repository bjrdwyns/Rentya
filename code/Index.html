<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{--navy:#1F2A44;--blue:#3B5BDB;--bg:#F6F7FB;--muted:#6B7280;--green:#15803D;--red:#B91C1C;--line:#E5E7EB}
  *{box-sizing:border-box}
  html{overscroll-behavior:none;overflow-x:clip;-webkit-text-size-adjust:100%}
  body{overscroll-behavior:none;overflow-x:clip;width:100%;margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#111827;-webkit-tap-highlight-color:transparent}
  .app{max-width:520px;margin:0 auto;padding-bottom:calc(66px + env(safe-area-inset-bottom));overflow-x:clip}
  .top{position:sticky;top:0;z-index:8;display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(246,247,251,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--navy);padding:calc(16px + env(safe-area-inset-top)) 18px 12px;transition:box-shadow .2s,padding .2s}
  .top.stuck{box-shadow:0 1px 0 var(--line),0 6px 16px rgba(15,23,42,.05);padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:10px}
  .top small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
  .top h2{margin:2px 0 0;font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.15;transition:font-size .2s}
  .top.stuck h2{font-size:20px}
  .top p{margin:4px 0 0;font-size:13px;color:var(--muted);transition:opacity .2s}
  .top.stuck p{display:none}
  .rotate{display:none}
  @media (orientation:landscape) and (max-height:500px) and (pointer:coarse){
    .app,.nav,.toast,.tipbox{display:none!important}
    .rotate{display:flex;position:fixed;inset:0;z-index:50;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;color:var(--navy)}
    .rotate svg{width:44px;height:44px;color:var(--blue)}
    .rotate b{font-size:17px}.rotate span{font-size:13px;color:var(--muted)}
  }
  .c{padding:14px}
  .card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .big{font-size:34px;font-weight:700;color:var(--navy)}
  .lbl{font-size:13px;color:var(--muted)}
  .v{font-size:20px;font-weight:700;color:var(--navy);margin-top:4px}
  .g{color:var(--green)!important}.r{color:var(--red)!important}
  .row{display:flex;gap:10px}.row>.card{flex:1;min-width:0}
  .bar{height:10px;background:var(--line);border-radius:6px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:#22A06B;border-radius:6px}
  .al{background:#FFF4E5;border-left:4px solid #F59E0B;font-size:13px;padding:10px 12px;border-radius:8px;color:#92400E;margin-bottom:12px}
  .al.red{background:#FDECEC;border-color:#DC2626;color:#991B1B}
  .ok{background:#ECFDF3}
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:3px max(8px,env(safe-area-inset-left)) calc(3px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right))}
  .nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
  .nav button{border:0;background:none;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0 2px;min-width:0;cursor:pointer;color:#94A3B8;font-size:10px;font-weight:500;-webkit-tap-highlight-color:transparent}
  .nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .nav .ni{width:40px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
  .nav .ni svg{width:20px;height:20px}
  .nav button:hover{color:#64748B}
  .nav .on{color:var(--blue);font-weight:700}.nav .on .ni{background:#EEF2FF}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  input[type=number],input[type=text],input[type=month]{width:100%;border:1px solid #D1D5DB;border-radius:12px;padding:12px;font-size:16px;margin-bottom:12px;background:#fff;font-family:inherit}
  input[type=range]{width:100%;accent-color:var(--blue);margin:8px 0 14px}
  .sl .t{display:flex;justify-content:space-between;font-size:14px}
  .btn{display:block;width:100%;border:0;background:var(--blue);color:#fff;padding:15px;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit}
  .btn.sec{background:#E5E7EB;color:var(--navy)}
  .btn:disabled{opacity:.5}
  .split{display:flex;height:16px;border-radius:6px;overflow:hidden;margin-top:8px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:10px;position:relative}
  .bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
  .bars .b i{width:100%;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
  .bars .b i.lo{background:#F87171}
  .bars .b small{font-size:10px;color:var(--muted);margin-top:4px}
  .goal{position:absolute;left:0;right:0;border-top:2px dashed #22A06B}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:9px 4px;border-bottom:1px solid var(--line)}td.n{text-align:right;white-space:nowrap}
  .hist{cursor:pointer}
  .x{border:0;background:none;color:var(--red);font-size:18px;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:9}
  .load{text-align:center;padding:60px 20px;color:var(--muted)}
  h3{font-size:15px;margin:4px 0 10px;color:var(--navy)}
  /* Accueil */
  .home-top h2{font-size:30px}
  .portal{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:176px;padding:18px 16px 16px;border:1px solid #EDF0F5;border-radius:22px;background:#fff;font-family:inherit;cursor:pointer;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.05);transition:transform .15s,box-shadow .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
  .tile::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--c);opacity:.06}
  .tile:hover{border-color:color-mix(in srgb,var(--c) 30%,#fff);box-shadow:0 2px 4px rgba(15,23,42,.05),0 12px 28px rgba(15,23,42,.08)}
  .tile:active{transform:scale(.97)}
  .tile:focus-visible{outline:2px solid var(--c);outline-offset:2px}
  .tile-ic{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--c);box-shadow:0 6px 14px color-mix(in srgb,var(--c) 35%,transparent)}
  .tile-ic svg{width:24px;height:24px}
  .tile-ic svg circle[fill]{fill:var(--c)}
  .tile-t{margin-top:auto;padding-top:18px;font-size:17px;font-weight:800;color:var(--navy);letter-spacing:-.2px}
  .tile-s{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35;min-height:2.7em}
  .tile-go{position:absolute;right:14px;top:18px;z-index:1;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#F4F6FA;color:var(--c);transition:transform .15s}
  .tile-go svg{width:14px;height:14px}
  .tile:hover .tile-go{transform:translateX(2px)}
  .portal-f{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:22px;font-size:12px;color:#94A3B8}
  .portal-f svg{width:14px;height:14px;color:#22A06B}
  @media (max-width:350px){.portal{gap:10px}.tile{min-height:150px;padding:14px 12px}.tile-s{font-size:11.5px}}
  /* Historique v3 */
  .hh{background:linear-gradient(150deg,#1F2A44,#2B3A63);color:#fff;border-radius:22px;padding:20px;margin-bottom:12px;box-shadow:0 10px 30px rgba(31,42,68,.25)}
  .hh .lbl{color:#CBD5E1;display:flex;align-items:center}
  .hh-v{font-size:clamp(32px,11vw,44px);font-weight:800;letter-spacing:-1.2px;line-height:1.1;margin:6px 0 2px;color:#A5B8FF;white-space:nowrap}
  .hh-v.neg{color:#FCA5A5}
  .hh-s{font-size:12px;color:#94A3B8}
  .hh-mini{font-size:11.5px;color:var(--muted);margin-top:3px}
  .panel{background:#fff;border-radius:20px;padding:16px;margin-bottom:18px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.04)}
  .panel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
  .panel-h .lbl{display:flex;align-items:center;font-size:12px}
  .panel-v{font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-.4px;margin-top:2px}
  .seg2{display:flex;background:#F1F3F8;border-radius:10px;padding:3px;flex:none}
  .seg2 button{border:0;background:none;font-weight:600;font-size:12px;font-family:inherit;color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer}
  .seg2 button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(15,23,42,.1)}
  .chip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:20px;background:#F1F3F8;color:var(--muted);white-space:nowrap}
  .chip.up{background:#E7F6EC;color:#15803D}.chip.dn{background:#FDECEC;color:#B91C1C}.chip.bl{background:#EEF2FF;color:var(--blue)}
  .viz{position:relative;margin:8px -4px 0;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}
  .viz svg{display:block;width:100%;overflow:visible}
  .viz text{font-family:inherit;font-size:10px;fill:#94A3B8}
  .viz .xl{fill:#94A3B8}.viz .xl.on{fill:var(--navy);font-weight:700}
  .vread{display:flex;flex-wrap:wrap;gap:8px 10px;background:#F6F7FB;border-radius:14px;padding:10px 12px;margin-top:10px;min-height:58px}
  .vread b{width:100%;font-size:12.5px;color:var(--navy)}
  .vread div{flex:1 1 0;min-width:64px;display:flex;flex-direction:column;font-size:10.5px;color:var(--muted)}.vread em{font-style:normal;font-size:14px;font-weight:800;color:var(--navy);margin-top:1px;white-space:nowrap}
  .vread em.up{color:#15803D}.vread em.dn{color:#B91C1C}.vread em.bl{color:var(--blue)}
  .vtip{position:absolute;top:0;pointer-events:none;background:#0F172A;color:#fff;border-radius:12px;padding:8px 10px;font-size:11.5px;min-width:148px;box-shadow:0 8px 20px rgba(15,23,42,.25);transition:left .1s ease-out,opacity .15s;z-index:2}
  .vtip b{display:block;font-size:12.5px;margin-bottom:4px}
  .vtip div{display:flex;justify-content:space-between;gap:14px;color:#CBD5E1;line-height:1.55}.vtip em{font-style:normal;font-weight:700;color:#fff}
  .vtip em.up{color:#6EE7B7}.vtip em.dn{color:#FCA5A5}.vtip em.bl{color:#A5B8FF}
  .vleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--muted);margin-top:10px}.vleg span{display:flex;align-items:center}
  .vleg .ln{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px}
  .vleg .ds{display:inline-block;width:14px;border-top:2px dashed #22A06B;margin-right:6px}
  .stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
  .stats3 div{background:#F6F7FB;border-radius:12px;padding:9px 10px}.stats3 span{display:block;font-size:10.5px;color:var(--muted)}.stats3 b{display:block;font-size:14px;color:var(--navy);margin-top:2px;white-space:nowrap}
  /* TVA */
  .tv{display:flex;align-items:center;gap:14px}
  .tv-g{position:relative;flex:none;width:132px;height:132px}
  .tv-g svg{width:100%;height:100%;transform:rotate(-90deg)}
  .tv-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .tv-c b{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--tc)}.tv-c span{font-size:10.5px;color:var(--muted)}
  .tv-i{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
  .tv-i>div>span{display:flex;align-items:center;font-size:11px;color:var(--muted)}
  .tv-i>div>span .i{margin-left:5px}.tv-i b{display:block;font-size:17px;color:var(--navy);white-space:nowrap}
  .tv-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px}
  .tv-steps div{text-align:center;font-size:10.5px;color:#94A3B8;padding-top:7px;border-top:4px solid #EEF1F6;border-radius:2px}
  .tv-steps div.done{border-top-color:var(--sc)}.tv-steps div.cur{color:var(--navy);font-weight:700;border-top-color:var(--sc)}
  .tvx{--tc:#16A34A;--tb:#ECFDF3}.tvx.mid{--tc:#D97706;--tb:#FFF7E6}.tvx.hi{--tc:#EA580C;--tb:#FFF1E8}.tvx.ko{--tc:#DC2626;--tb:#FDECEC}
  .tv-m{margin-top:12px;font-size:12.5px;padding:10px 12px;border-radius:12px;background:var(--tb);color:var(--tc);font-weight:600;line-height:1.4}
  .tv-m.warn{background:#FFF7E6;color:#B45309}
  .tv-src{margin-top:8px;font-size:11px;color:#94A3B8;text-align:center}
  /* Mois */
  .yr{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 8px}
  .yr b{font-size:14px;color:var(--navy)}.yr span{font-size:11px;color:var(--muted)}
  .mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
  .mt{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid #EDF0F5;background:#fff;border-radius:14px;padding:9px 10px 9px 12px;font-family:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:transform .12s,border-color .15s;overflow:hidden;color:inherit;min-width:0}
  .mt:active{transform:scale(.96)}.mt:hover{border-color:#DCE3FB}
  .mt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--mc)}
  .mt.ok{--mc:#22A06B}.mt.mid{--mc:#F59E0B}.mt.ko{--mc:#EF4444}
  .mt-h{display:flex;justify-content:space-between;align-items:center;width:100%}
  .mt-h b{font-size:12.5px;color:var(--muted);font-weight:600}
  .mt-s{width:7px;height:7px;border-radius:50%;background:var(--mc)}
  .mt-v{font-size:16px;font-weight:800;color:var(--navy);letter-spacing:-.3px;margin:3px 0 1px;white-space:nowrap}
  .mt-v.r{color:var(--red)}
  .mt-f{font-size:10.5px;color:#94A3B8;white-space:nowrap}
  .mf{position:relative;display:flex;flex-direction:column;width:100%;text-align:left;border:1px solid #DCE3FB;background:linear-gradient(160deg,#F5F7FF,#fff 60%);border-radius:20px;padding:15px 16px 14px;margin-bottom:16px;font-family:inherit;cursor:pointer;color:inherit;box-shadow:0 2px 4px rgba(15,23,42,.04),0 10px 26px rgba(59,91,219,.10);transition:transform .12s;overflow:hidden}
  .mf::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mc)}
  .mf.ok{--mc:#22A06B}.mf.mid{--mc:#F59E0B}.mf.ko{--mc:#EF4444}
  .mf:active{transform:scale(.98)}
  .mf-h{display:flex;justify-content:space-between;align-items:center}
  .mf-h small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
  .mf-h b{font-size:17px;color:var(--navy)}
  .mf-h svg{width:18px;height:18px;color:#94A3B8}
  .mf-r{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 10px}
  .mf-v{font-size:30px;font-weight:800;letter-spacing:-.8px;color:var(--navy);white-space:nowrap}.mf-v.r{color:var(--red)}
  .chip.mid{background:#FFF4E5;color:#B45309}
  .mf-p{display:block;height:5px;border-radius:4px;background:#E8ECF4;overflow:hidden}.mf-p i{display:block;height:100%;border-radius:4px;background:var(--mc)}
  .mf-f{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:11.5px;color:var(--muted)}.mf-f b{color:var(--navy)}.mf-f b.bl{color:var(--blue)}.mf-f b.r{color:var(--red)}
  /* Saisie */
  .ms{display:flex;align-items:center;gap:8px;background:#fff;border-radius:18px;padding:8px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.04)}
  .ms-b{flex:none;width:44px;height:44px;border:0;border-radius:14px;background:#F4F6FA;color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .ms-b svg{width:20px;height:20px}.ms-b:disabled{opacity:.3;cursor:default}.ms-b:not(:disabled):active{transform:scale(.94)}
  .ms-c{flex:1;text-align:center;min-width:0}.ms-c b{display:block;font-size:17px;color:var(--navy)}
  .ms-c span{font-size:11.5px;font-weight:600}.ms-c .nw{color:#94A3B8}.ms-c .ex{color:#D97706}
  .fs{background:#fff;border-radius:18px;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.04);overflow:hidden}
  .fi{display:flex;gap:12px;padding:14px 14px;cursor:text;border-bottom:1px solid #F1F3F7;transition:background .15s;margin:0;color:inherit;font-size:inherit}
  .fi:last-child{border-bottom:0}
  .fi:focus-within{background:#F7F9FF}
  .fi-ic{flex:none;width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--fc) 12%,#fff);color:var(--fc);display:flex;align-items:center;justify-content:center;transition:.15s;margin-top:2px}
  .fi-ic svg{width:19px;height:19px}
  .fi:focus-within .fi-ic{background:var(--fc);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--fc) 35%,transparent)}
  .fi:focus-within{background:color-mix(in srgb,var(--fc) 4%,#fff)}
  .fi-h.auto{color:#D97706}
  .fi-b{flex:1;min-width:0;display:flex;flex-direction:column}
  .fi-l{display:flex;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600}
  .fi-row{display:flex;align-items:baseline;gap:6px}
  .fi-row input{flex:1;min-width:0;border:0;outline:none;background:none;padding:2px 0 0;margin:0;font-weight:800;font-size:24px;font-family:inherit;color:var(--navy);letter-spacing:-.4px;font-variant-numeric:tabular-nums}
  .fi-row input::placeholder{color:#CBD5E1;font-weight:700}
  #f_note{font-size:16px;font-weight:600;letter-spacing:0}
  .fi-row em{font-style:normal;font-size:14px;font-weight:700;color:#94A3B8}
  .fi-h{font-size:11.5px;color:#94A3B8;margin-top:3px;line-height:1.35}
  .more{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;font-weight:600;font-size:13.5px;font-family:inherit;color:var(--blue);padding:8px 6px 12px;cursor:pointer}
  .more span{font-weight:500;color:#94A3B8;font-size:12px}
  .res{border-radius:18px;padding:14px 16px;margin:4px 0 14px;background:#fff;border:1.5px dashed #E2E8F0}
  .res-e{display:flex;gap:10px;align-items:center;font-size:13px;color:#94A3B8}.res-e svg{flex:none;width:20px;height:20px}
  .res.on{border:1px solid #DCE3FB;background:linear-gradient(160deg,#F5F7FF,#fff 65%);box-shadow:0 8px 22px rgba(59,91,219,.08)}
  .res.ok{--mc:#22A06B}.res.mid{--mc:#F59E0B}.res.ko{--mc:#EF4444}
  .res-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.res-h>span:first-child{display:flex;align-items:center;font-size:12.5px;color:var(--muted)}
  .res-v{font-size:32px;font-weight:800;color:var(--navy);letter-spacing:-.8px;margin:4px 0 10px}
  .res.ko .res-v{color:var(--red)}
  .res-p{height:6px;border-radius:4px;background:#E8ECF4;overflow:hidden}.res-p i{display:block;height:100%;background:var(--mc);border-radius:4px;transition:width .3s}
  .res-d{margin-top:12px}.res-d summary{font-size:12.5px;color:var(--blue);font-weight:600;cursor:pointer;list-style:none}

<div class="toast" id="toast"></div>
<div class="tipbox" id="tipbox"></div>
<div class="rotate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><line x1="11" y1="18" x2="13" y2="18"/></svg><b>Tournez votre téléphone</b><span>L'application s'utilise en mode portrait.</span></div>

<script>
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const eur = (n, d = 0) => (isFinite(n) ? n : 0).toLocaleString('fr-FR', {minimumFractionDigits: d, maximumFractionDigits: d}) + ' €';
const pct = n => (isFinite(n) ? n * 100 : 0).toLocaleString('fr-FR', {maximumFractionDigits: 1}) + ' %';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nowKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const label = k => { const [y, m] = k.split('-'); return MOIS[+m - 1] + ' ' + y; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

let D = null, tab = 'home', sim = null, editKey = null;

// Appels serveur (ou données de démonstration hors Google)
const TOKEN = '<?= token ?>'; // injecté par Apps Script
function call(fn, ...args) {
  return new Promise((ok, ko) => {
    if (typeof google !== 'undefined' && google.script) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](TOKEN, ...args);
    } else ok(demo(fn, ...args));
  });
}

// ---------- Calculs ----------
function fixes() { return D.charges.reduce((s, c) => s + (Number(c.montant) || 0), 0); }
function tauxCA() { const p = D.params; return (+p.urssaf) + (+p.tiktok) + (+p.affilies); }
function prixVente(cout, coef) { return cout * coef / (1 - D.params.tiktok); }
function margeSac(cout, coef) { return prixVente(cout, coef) * (1 - tauxCA()) - cout - (+D.params.emballage); }
function calcMois(m) {
  const p = D.params;
  const urssaf = m.ca * p.urssaf, comm = m.ca * ((+p.tiktok) + (+p.affilies)), emb = m.sacs * p.emballage, fx = fixes();
  const rem = m.ca - m.achats - urssaf - comm - emb - fx;
  return {urssaf, comm, emb, fx, rem, ecart: rem - p.objectif, margeReelle: m.sacs ? (m.ca * (1 - tauxCA()) - m.achats - emb) / m.sacs : 0};
}
function caCumul(key) {
  const y = key.slice(0, 4);
  return D.mois.filter(m => m.mois.slice(0, 4) === y && m.mois <= key).reduce((s, m) => s + m.ca, 0);
}

// ---------- Écrans ----------
function home() {
  const p = D.params, d = new Date();
  const jour = d.toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'});
  const h = d.getHours(), salut = h < 5 || h >= 18 ? 'Bonsoir' : 'Bonjour';
  // Mois terminés sans saisie : du mois suivant le dernier enregistré jusqu'au mois précédent (au plus 12)
  const prevKey = shiftKey(nowKey(), -1), keys = D.mois.map(m => m.mois).sort(), lastM = keys[keys.length - 1];
  const missing = [];
  for (let k = lastM ? shiftKey(lastM, 1) : prevKey; k <= prevKey && missing.length < 12; k = shiftKey(k, 1)) if (!keys.includes(k)) missing.push(k);
  const mName = k => cap(MOIS[+k.slice(5) - 1]);
  const last = D.mois.find(m => m.mois === lastM), ms = margeSac(+p.coutMoyen, +p.coef);
  const tiles = [
    ['sim', 'Simuler', '', '#3B5BDB'],
    ['add', 'Saisir', missing.length ? `${mName(missing[0])} à saisir` : '', '#16A34A'],
    ['hist', 'Historique', '', '#D97706'],
    ['set', 'Réglages', '', '#64748B'],
  ];
  const remind = missing.length ? `<div class="rem"><span class="rem-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M12 13v3M12 19h.01"/></svg></span>
    <span class="rem-t"><b>${missing.length === 1 ? `${mName(missing[0])} n'est pas encore saisi` : `${missing.length} mois ne sont pas encore saisis`}</b><span>${missing.length === 1 ? 'Pour garder un historique complet' : `De ${label(missing[0])} à ${label(missing[missing.length - 1])}`}</span></span>
    <button class="rem-b" onclick="editKey='${missing[0]}';go('add')">Saisir</button></div>` : '';
  const icon = k => TABS.find(t => t[0] === k)[1];
  return `<div class="top home-top"><div><small>${cap(jour)}</small><h2>${salut}${p.prenom ? ' ' + esc(p.prenom) : ''}</h2><p>Où souhaitez-vous aller ?</p></div></div>
  <div class="c">${remind}<div class="portal">
    ${tiles.map(([k, t, sub, c]) => `<button type="button" class="tile" style="--c:${c}" onclick="go('${k}')">
      <span class="tile-ic">${icon(k)}</span>
      <span class="tile-t">${t}</span>${sub ? `<span class="tile-s todo">${sub}</span>` : ''}
      <span class="tile-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
    </button>`).join('')}
  </div>
  <div class="portal-f"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Synchronisé avec Google Sheets</div></div>`;
}

// Franchise en base de TVA (vente de marchandises) : seuil de base et seuil majoré, réglables dans Réglages.
// Valeurs par défaut vérifiées pour 2026 : 85 000 € / 93 500 € (inchangées depuis 2025).
function tvaBar(year) {
  const p = D.params, base = +p.seuilTva, maj = +p.seuilTvaMaj || base, verif = +p.seuilTvaAnnee || 0;
  const ca = D.mois.filter(m => m.mois.slice(0, 4) === String(year)).reduce((s, m) => s + m.ca, 0);
  const caPrec = D.mois.filter(m => m.mois.slice(0, 4) === String(year - 1)).reduce((s, m) => s + m.ca, 0);
  const r = ca / base;
  let st, step, msg;
  if (ca >= maj) { st = 'ko'; step = 3; msg = `Seuil majoré dépassé : la TVA est due dès le jour du dépassement. Contactez votre comptable.`; }
  else if (ca > base) { st = 'hi'; step = 3; msg = `Seuil de base dépassé : franchise conservée en ${year}, TVA due à partir du 1<sup>er</sup> janvier ${year + 1}.`; }
  else if (r >= 0.9) { st = 'hi'; step = 2; msg = `Seuil très proche : plus que ${eur(base - ca)} avant le seuil de base.`; }
  else if (r >= 0.75) { st = 'mid'; step = 1; msg = `Vous approchez du seuil : surveillez vos prochains mois.`; }
  else { st = 'ok'; step = 0; msg = `Vous êtes en franchise de TVA : aucune TVA à facturer.`; }
  // Jauge circulaire : 100 % du cercle = seuil majoré ; repère au seuil de base
  const R = 54, C = 2 * Math.PI * R, prog = Math.min(1, ca / maj), mark = base / maj;
  const col = {ok: '#22A06B', mid: '#F59E0B', hi: '#EA580C', ko: '#DC2626'}[st];
  const steps = [['Franchise', '#22A06B'], ['Vigilance', '#F59E0B'], ['Proche', '#EA580C'], ['Dépassé', '#DC2626']];
  return `<div class="sec-t">Franchise de TVA ${year}</div><div class="panel tvx ${st}">
    <div class="tv">
      <div class="tv-g"><svg viewBox="0 0 132 132">
        <circle cx="66" cy="66" r="${R}" fill="none" stroke="#EEF1F6" stroke-width="12"/>
        <circle cx="66" cy="66" r="${R}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C * prog} ${C}" style="transition:stroke-dasharray .5s"/>
        <line x1="${66 + (R - 9) * Math.cos(2 * Math.PI * mark)}" y1="${66 + (R - 9) * Math.sin(2 * Math.PI * mark)}" x2="${66 + (R + 9) * Math.cos(2 * Math.PI * mark)}" y2="${66 + (R + 9) * Math.sin(2 * Math.PI * mark)}" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
      </svg><div class="tv-c"><b>${pct(r)}</b><span>du seuil de base</span></div></div>
      <div class="tv-i">
        <div><span>CA cumulé ${year}${info('h_tva')}</span><b>${eur(ca)}</b></div>
        <div><span>Reste avant le seuil de base</span><b style="color:var(--tc)">${ca < base ? eur(base - ca) : 'Dépassé'}</b></div>
        <div><span>Seuils base / majoré</span><b style="font-size:13px">${eur(base)} / ${eur(maj)}</b></div>
      </div>
    </div>
    <div class="tv-steps">${steps.map(([l, c], i) => `<div class="${i < step ? 'done' : i === step ? 'cur' : ''}" style="--sc:${c}">${l}</div>`).join('')}</div>
    <div class="tv-m">${msg}${ca > base && ca < maj ? ` Encore ${eur(maj - ca)} avant le seuil majoré.` : ''}</div>
    ${caPrec > base ? `<div class="tv-m warn">CA ${year - 1} (${eur(caPrec)}) supérieur au seuil de base : la franchise ne s'applique plus en ${year}.</div>` : ''}
    ${year > verif ? `<div class="tv-m warn">Seuils vérifiés pour ${verif || '—'} : confirmez les montants ${year} sur impots.gouv.fr puis mettez-les à jour dans Réglages.</div>` : `<div class="tv-src">Seuils ${verif} · vente de marchandises · modifiables dans Réglages</div>`}
  </div>`;
}

const ABR = ['janv', 'févr', 'mars', 'avr', 'mai', 'juin', 'juil', 'août', 'sept', 'oct', 'nov', 'déc'];
const kfmt = v => Math.abs(v) >= 1000 ? (v / 1000).toLocaleString('fr-FR', {maximumFractionDigits: 1}) + ' k' : Math.round(v).toLocaleString('fr-FR');
function niceStep(range, n) { const raw = range / n, mag = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / mag; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag; }

// Graphique épuré : courbe lissée (dégradé), repère de sélection, objectif optionnel, mini-barres de variation optionnelles
function smooth(pts) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) { const p0 = pts[i - 2] || pts[i - 1], p1 = pts[i - 1], p2 = pts[i], p3 = pts[i + 1] || p2;
    const cl = v => Math.max(Math.min(p1[1], p2[1]), Math.min(Math.max(p1[1], p2[1]), v));
    d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${cl(p1[1] + (p2[1] - p0[1]) / 6)} ${p2[0] - (p3[0] - p1[0]) / 6},${cl(p2[1] - (p3[1] - p1[1]) / 6)} ${p2[0]},${p2[1]}`; }
  return d;
}
function svgChart(c) {
  const W = c.w, VB = c.bars ? 44 : 0, H = 170 + VB, L = 6, R = 6, T = 16, B = 24 + VB, n = c.vals.length;
  const all = c.vals.concat(c.goal != null ? [c.goal] : []).concat([0]);
  let lo = Math.min(...all), hi = Math.max(...all); if (hi === lo) hi = lo + 1;
  const pad = (hi - lo) * .12; hi += pad; if (lo < 0) lo -= pad;
  const X = i => n === 1 ? W / 2 : L + 8 + i * (W - L - R - 16) / (n - 1);
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const col = c.color, gid = 'g_' + c.id;
  let g = `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset=".85" stop-color="${col}" stop-opacity="0"/></linearGradient>
    <linearGradient id="${gid}s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${col}" stop-opacity=".45"/><stop offset="1" stop-color="${col}"/></linearGradient></defs>`;
  // repères horizontaux discrets
  [lo < 0 ? 0 : null, hi - pad].filter(v => v !== null).forEach(v => { g += `<line x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EEF1F6" stroke-dasharray="2 4"/>`; });
  g += `<line x1="0" x2="${W}" y1="${Y(Math.max(lo, 0))}" y2="${Y(Math.max(lo, 0))}" stroke="#E2E8F0"/>`;
  if (c.goal != null) g += `<rect x="0" y="${Y(c.goal) - .75}" width="${W}" height="1.5" fill="#22A06B" opacity=".55"/>`;
  const pts = c.vals.map((v, i) => [X(i), Y(v)]), d = n > 1 ? smooth(pts) : `M${pts[0][0] - 1},${pts[0][1]} L${pts[0][0] + 1},${pts[0][1]}`;
  // zone + courbe ; partie après la sélection estompée
  g += `<path d="${d} L${pts[n - 1][0]},${Y(Math.max(lo, 0))} L${pts[0][0]},${Y(Math.max(lo, 0))} Z" fill="url(#${gid})"/>`;
  g += `<path d="${d}" fill="none" stroke="url(#${gid}s)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  const sx = X(c.sel), sy = Y(c.vals[c.sel]);
  g += `<line x1="${sx}" x2="${sx}" y1="${T - 8}" y2="${H - B}" stroke="#0F172A" stroke-width="1" stroke-dasharray="3 3" opacity=".35"/>`;
  // mini-barres de variation sous l'axe
  if (c.bars) { const m = Math.max(1, ...c.bars.map(Math.abs)), base = H - 24 - VB / 2, bw = Math.min(14, (W - 30) / n * .45);
    g += `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="#EEF1F6"/>`;
    c.bars.forEach((v, i) => { const h = Math.max(2, Math.abs(v) / m * (VB / 2 - 4));
      g += `<rect x="${X(i) - bw / 2}" y="${v >= 0 ? base - h : base}" width="${bw}" height="${h}" rx="3" fill="${v > 0 ? '#22A06B' : v < 0 ? '#EF4444' : '#CBD5E1'}" opacity="${i === c.sel ? 1 : .45}"/>`; }); }
  pts.forEach((p, i) => { if (i !== c.sel && c.dot) g += `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${c.dot(i)}"/>`; });
  const dc = c.dot ? c.dot(c.sel) : col;
  g += `<circle cx="${sx}" cy="${sy}" r="11" fill="${dc}" opacity=".15"/><circle cx="${sx}" cy="${sy}" r="5.5" fill="#fff" stroke="${dc}" stroke-width="3"/>`;
  const every = n > 7 ? 2 : 1;
  c.labels.forEach((l, i) => { if (i === c.sel) g += `<rect x="${X(i) - 19}" y="${H - 19}" width="38" height="17" rx="8.5" fill="#0F172A"/><text x="${X(i)}" y="${H - 7}" text-anchor="middle" class="xs">${l}</text>`;
    else if ((n - 1 - i) % every === 0 && Math.abs(i - c.sel) > 0) g += `<text class="xl" x="${X(i)}" y="${H - 7}" text-anchor="middle">${l}</text>`; });
  return {svg: `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}</svg>`, X, n};
}

// État et rendu des deux graphiques de l'historique
const VZ = {ev: {sel: null, metric: 'net', range: 12}, tr: {sel: null, range: 12}};
function trSeries() {
  let cum = 0;
  return D.mois.map(m => { const t = repartition(m).treso; cum += t; return {m, delta: t, cum}; });
}
const sliceR = (arr, r) => r ? arr.slice(-r) : arr.slice();
function drawViz(id) {
  const el = document.getElementById('vz_' + id), hd = document.getElementById('vh_' + id); if (!el) return;
  const w = el.clientWidth; if (!w) return;
  let c;
  if (id === 'ev') {
    const list = sliceR(D.mois, VZ.ev.range), obj = +D.params.objectif, net = VZ.ev.metric === 'net';
    if (VZ.ev.sel === null || VZ.ev.sel >= list.length) VZ.ev.sel = list.length - 1;
    const vals = list.map(m => net ? calcMois(m).rem : m.ca), i = VZ.ev.sel, m = list[i], r = calcMois(m);
    const prev = i > 0 ? vals[i - 1] : null, ev = prev === null || prev === 0 ? null : (vals[i] - prev) / Math.abs(prev);
    const dot = k => !net ? '#3B5BDB' : vals[k] < 0 ? '#EF4444' : vals[k] >= obj ? '#22A06B' : '#F59E0B';
    c = svgChart({id, w, vals, sel: i, labels: list.map(m => ABR[+m.mois.slice(5) - 1]), goal: net ? obj : null, color: '#3B5BDB', dot});
    hd.innerHTML = `<div class="vh-l">${cap(label(m.mois))}</div>
      <div class="vh-r"><span class="vh-v ${vals[i] < 0 ? 'r' : ''}">${eur(vals[i])}</span>
      ${ev === null ? '' : `<span class="chip ${ev >= 0 ? 'up' : 'dn'}">${ev >= 0 ? '▲' : '▼'} ${pct(Math.abs(ev))}</span>`}</div>
      <div class="vh-s">${net ? `CA ${eur(m.ca)} · <b style="color:${dot(i)}">${r.ecart >= 0 ? 'objectif atteint' : r.rem < 0 ? 'mois en perte' : Math.round(r.rem / obj * 100) + ' % de l\'objectif'}</b>` : `Bénéfice net ${eur(r.rem)} · ${m.sacs} sacs`}</div>`;
  } else {
    const list = sliceR(trSeries(), VZ.tr.range);
    if (VZ.tr.sel === null || VZ.tr.sel >= list.length) VZ.tr.sel = list.length - 1;
    const i = VZ.tr.sel, x = list[i];
    c = svgChart({id, w, vals: list.map(x => x.cum), bars: list.map(x => x.delta), sel: i, labels: list.map(x => ABR[+x.m.mois.slice(5) - 1]), color: '#6366F1'});
    hd.innerHTML = `<div class="vh-l">Solde fin ${label(x.m.mois)}</div>
      <div class="vh-r"><span class="vh-v ${x.cum < 0 ? 'r' : ''}">${eur(x.cum)}</span>
      <span class="chip ${x.delta > 0 ? 'up' : x.delta < 0 ? 'dn' : ''}">${x.delta > 0 ? '▲ + ' + eur(x.delta) : x.delta < 0 ? '▼ ' + eur(x.delta) : 'stable'}</span></div>
      <div class="vh-s">${x.delta > 0 ? 'Excédent versé en trésorerie ce mois-ci' : x.delta < 0 ? 'Perte prélevée sur la trésorerie' : 'Aucun excédent : bénéfice ≤ objectif'}</div>`;
  }
  el.innerHTML = c.svg; el._X = c.X; el._n = c.n;
}
function vzPick(e, id) {
  const el = document.getElementById('vz_' + id); if (!el || !el._X) return;
  if (e.type === 'pointermove' && e.pointerType === 'mouse' && e.buttons === 0) return;
  const x = e.clientX - el.getBoundingClientRect().left;
  let best = 0; for (let i = 1; i < el._n; i++) if (Math.abs(el._X(i) - x) < Math.abs(el._X(best) - x)) best = i;
  if (best !== VZ[id].sel) { VZ[id].sel = best; drawViz(id); if (navigator.vibrate) try { navigator.vibrate(4); } catch (_) {} }
}
function vzRange(id, r) { VZ[id].range = r; VZ[id].sel = null; drawViz(id); document.querySelectorAll(`#rg_${id} button`).forEach(b => b.classList.toggle('on', +b.dataset.r === r)); }
const rangeSeg = id => `<div class="rg" id="rg_${id}">${[[6, '6 M'], [12, '12 M'], [0, 'Tout']].map(([r, l]) => `<button data-r="${r}" class="${VZ[id].range === r ? 'on' : ''}" onclick="vzRange('${id}',${r})">${l}</button>`).join('')}</div>`;
function drawCharts() { drawViz('ev'); drawViz('tr'); }

}
